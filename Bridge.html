
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
</head>
<body>
<script>
(function () {
  'use strict';

  const ALLOWED_ORIGIN = 'https://huytest2026.github.io';

  window.addEventListener('message', function (event) {
    // Chỉ nhận yêu cầu từ website GitHub Pages đã chỉ định.
    if (event.origin !== ALLOWED_ORIGIN) return;
    if (event.source !== parent) return;

    const msg = event.data;
    if (!msg || msg.type !== 'GIA_PHA_API_REQUEST') return;
    if (!msg.requestId || !msg.payload || !msg.payload.action) return;

    google.script.run
      .withSuccessHandler(function (result) {
        parent.postMessage({
          type: 'GIA_PHA_API_RESPONSE',
          requestId: msg.requestId,
          success: true,
          result: JSON.parse(JSON.stringify(result))
        }, event.origin);
      })
      .withFailureHandler(function (error) {
        parent.postMessage({
          type: 'GIA_PHA_API_RESPONSE',
          requestId: msg.requestId,
          success: false,
          error: error && error.message
            ? error.message
            : String(error)
        }, event.origin);
      })
      .apiBridgeDispatch(msg.payload);
  });
})();
</script>
</body>
</html>
